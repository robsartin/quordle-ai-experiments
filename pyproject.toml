[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quordle-ai-experiments"
version = "0.1.0"
description = "Experiments in playing Quordle with an AI agent."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "matplotlib>=3.5",
    "anthropic>=0.40",
    "pydantic>=2",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
quordle-sim = "quordle.runner:main"
quordle-stats = "quordle.dashboard:main"
quordle-objectives = "quordle.objectives:main"
quordle-openers = "quordle.openers:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quordle"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
extend-exclude = [
    "docs/superpowers/plans/2026-08-01-phase1-engine-heuristic-solver.md",
    "docs/superpowers/plans/2026-08-01-browserenv.md",
    "docs/superpowers/plans/2026-08-02-multi-game-loop.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# dashboard.py embeds a literal HTML/CSS template in an f-string; two CSS rule
# lines exceed line-length. Wrapping them would insert real newlines into the
# generated <style> block, changing the dashboard's output HTML, so E501 is
# ignored for this file only rather than reformatting the template content.
"src/quordle/dashboard.py" = ["E501"]

[tool.mypy]
# python_version is 3.12, not the project floor of 3.11: numpy's bundled
# stubs (pulled in transitively via matplotlib, used only by
# quordle.dashboard) use the PEP 695 `type` statement, which mypy rejects as
# a syntax error when parsing under python_version = "3.11" -- this blocks
# mypy entirely (it can't even reach our own files), not just a strictness
# flag, so it can't be fixed with a per-module override: mypy refuses
# per-module `python_version` overrides ("Per-module sections should only
# specify per-module flags"), and per-module `follow_imports = "skip"` for
# numpy does not avoid the parse error either (verified). The dev
# environment already runs Python 3.12, and none of our own code uses
# 3.12-only syntax, so this only changes what third-party stub syntax mypy
# is willing to parse.
python_version = "3.12"
packages = ["quordle"]
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quordle"]
# browser_env.py is Playwright glue driving a real browser against
# beta.quordle.com; it is verified by the gated live test
# (tests/browser/test_browser_env.py, RUN_BROWSER_TESTS=1), not by the
# offline unit-test suite, so it is omitted from the coverage gate here.
omit = ["src/quordle/browser/browser_env.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
