[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quordle-ai-experiments"
version = "0.1.0"
description = "Experiments in playing Quordle with an AI agent."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "matplotlib>=3.5",
    "anthropic>=0.40",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
quordle-sim = "quordle.runner:main"
quordle-stats = "quordle.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quordle"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
extend-exclude = [
    "quordle_stats.py",
    "docs/superpowers/plans/2026-08-01-phase1-engine-heuristic-solver.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["quordle"]
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quordle"]

[tool.coverage.report]
fail_under = 80
show_missing = true
